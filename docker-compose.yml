version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: transporte_univ_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: transporte_universitario
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password_123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d transporte_universitario"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transporte_univ_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transporte_universitario
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin_password_123
      JWT_SECRET: ChaveSecretaSuperSeguraParaProjetoTransporteUniversitario2026!
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,https://unibus-three.vercel.app
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transporte_univ_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
