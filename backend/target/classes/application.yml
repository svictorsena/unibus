spring:
  datasource:
    url: jdbc:h2:mem:transporte_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: ${JWT_SECRET:ChaveSecretaSuperSeguraParaProjetoTransporteUniversitario2026!}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://unibus-three.vercel.app}
